services:
  - type: web
    name: feeguard
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: PAYPAL_BASE
        value: https://api-m.sandbox.paypal.com
